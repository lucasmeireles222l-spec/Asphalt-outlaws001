name = "asphalt-outlaws"
main = "worker.js"
compatibility_date = "2025-06-01"

# Arquivos do jogo (pasta public/): index.html, sw.js, version.json, manifest, ícones, _headers
[assets]
directory = "./public"
binding = "ASSETS"

# Durable Object: guarda todas as salas/jogadores em tempo real
[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]

# Variáveis PÚBLICAS (a chave "publishable" já está no seu index.html). NÃO coloque a service_role aqui!
